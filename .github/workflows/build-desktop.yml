name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis,msi
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: yingfeng-data-windows-x64-[bundle]

  macos:
    name: macOS ${{ matrix.display-name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - display-name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            artifact-suffix: arm64
          - display-name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact-suffix: x64

    env:
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS application
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles app,dmg
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: yingfeng-data-macos-${{ matrix.artifact-suffix }}-[bundle]

  publish:
    name: Publish installers to public repository
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
      RELEASE_REPOSITORY: ${{ vars.PUBLIC_RELEASE_REPO }}

    steps:
      - name: Check publishing configuration
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Missing Actions secret: PUBLIC_RELEASE_TOKEN"
            exit 1
          fi
          if [[ -z "$RELEASE_REPOSITORY" ]]; then
            echo "Missing Actions variable: PUBLIC_RELEASE_REPO"
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Create or update public release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          title="迎风数据 ${tag#v}"

          if ! gh release view "$tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$RELEASE_REPOSITORY" \
              --title "$title" \
              --notes "迎风数据桌面版安装包。源码保存在私有仓库中。"
          fi

          mapfile -d '' assets < <(
            find release-assets -type f \
              \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
              -print0
          )

          if (( ${#assets[@]} == 0 )); then
            echo "No installer assets were found"
            exit 1
          fi

          gh release upload "$tag" "${assets[@]}" \
            --repo "$RELEASE_REPOSITORY" \
            --clobber
