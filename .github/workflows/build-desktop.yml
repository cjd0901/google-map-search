name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis,msi
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: yingfeng-data-windows-x64-[bundle]

  macos:
    name: macOS ${{ matrix.display-name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - display-name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            artifact-suffix: arm64
          - display-name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact-suffix: x64

    env:
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS application
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles app,dmg
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: yingfeng-data-macos-${{ matrix.artifact-suffix }}-[bundle]
